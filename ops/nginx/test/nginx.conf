# Test configuration for ops/nginx/test.sh (#600). Not for the server.
# Loads the real vhost (maps and TLS servers on 80/443, with a dummy
# certificate) and a plain HTTP server on 8080 with the site rules, so the
# language switch, the headers and the files of dist/ (mounted at
# /opt/stavewise/web) are tested without TLS.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    include /etc/nginx/stavewise.app.conf;

    server {
        listen 8080 default_server;
        server_name stavewise.app;

        include /etc/nginx/snippets/stavewise-site.conf;
    }
}
