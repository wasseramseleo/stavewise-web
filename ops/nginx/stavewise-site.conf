# Site rules of stavewise.app, included into the main server block of
# stavewise.app.conf and into the test server of ops/nginx/test/ (#600).
# Nothing here needs TLS. The maps $stavewise_lang, $stavewise_vary and
# $stavewise_cache_control are defined in stavewise.app.conf.

# Deploy target of rsync via rrsync (#538 point 10: /opt/stavewise/web, not
# /var/www).
root /opt/stavewise/web;
index index.html;

# Raw logs in the combined format (#542 decision 9, "Vorgaben für andere
# Tickets"); logrotate keeps them 14 days (ops/logrotate/stavewise-web),
# GoAccess reads them with anonymized IPs (ops/goaccess/). Own directory,
# because Debian's /etc/logrotate.d/nginx already rotates /var/log/nginx/*.log
# and logrotate refuses a file matched by two rules.
access_log /var/log/nginx/stavewise/access.log combined;
error_log  /var/log/nginx/stavewise/error.log;

# Security headers on exactly one level, `always`, so they reach every
# response: page, font, redirect, error (as on mind-the-brain.com, #591 open
# question 7). HSTS with includeSubDomains but without preload: preload is an
# entry in the browsers that cannot be undone. No Content-Security-Policy.
# No location below may have an add_header of its own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cache-Control $stavewise_cache_control always;
add_header Vary $stavewise_vary always;

gzip on;
gzip_vary on;
gzip_types text/plain text/css image/svg+xml;

# Language switch (#545 "Sprachweiche"): the same paths in both languages.
# /, /beta, /privacy, /impressum and /pianos redirect with 302 by
# Accept-Language to /de/... or /en/...; the query string stays, anchors stay
# because the browser keeps them. No cookie, no JavaScript.
# A named capture, because evaluating the regex map $stavewise_lang resets $1.
location ~ ^/(?<stavewise_page>beta|privacy|impressum|pianos)?$ {
    return 302 /$stavewise_lang/$stavewise_page$is_args$args;
}

# Astro writes directories (dist/de/beta/index.html), served as /de/beta.
location / {
    try_files $uri $uri/index.html $uri/ =404;
}

# No dotfiles.
location ~ /\. {
    deny all;
}
