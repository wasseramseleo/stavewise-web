# nginx vhost for stavewise.app (#545 "VPS", #591, #600).
#
# Install: this file to /etc/nginx/sites-available/stavewise.app (linked from
# sites-enabled), stavewise-site.conf to /etc/nginx/snippets/. Both belong in
# the http context of nginx.conf.
#
# This file holds what needs the http context or TLS: the maps, the TLS
# server blocks and the redirects. Everything inside the main server that
# works without TLS lives in stavewise-site.conf, so ops/nginx/test.sh can load
# it without a certificate.

# Language switch (#545 "Sprachweiche"): a browser whose Accept-Language
# starts with de (de, de-AT, de-DE, ...) gets German, everyone else English.
# Only the first language counts, the q-values are not weighed.
map $http_accept_language $stavewise_lang {
    default en;
    ~*^de   de;
}

# The redirects of the language switch vary with Accept-Language, so caches
# must key on it (#600). An empty value means nginx omits the header; this
# keeps every add_header on one level (see below).
map $uri $stavewise_vary {
    default                                  "";
    ~^/(beta|privacy|impressum|pianos)?$     "Accept-Language";
}

# Cache-Control comes from these maps and not from an add_header per location,
# as on mind-the-brain.com: nginx inherits add_header only into blocks without
# an add_header of their own, so a cache header in a location would drop every
# security header there (#600).
#
# By content type: HTML no-cache (deploys replace files in place, the next
# visit asks again); images, fonts and video one year (#545 "VPS": "Video und
# Bilder mit langem Cache"). Everything else (OFL texts) gets no header.
map $sent_http_content_type $stavewise_cache_by_type {
    default            "";
    ~*^text/html       "no-cache";
    ~*^image/          "public, max-age=31536000";
    ~*^font/           "public, max-age=31536000";
    ~*^video/          "public, max-age=31536000";
}

# Astro's build output under /_astro/ has a content hash in its name:
# one year and immutable. Everything else falls back to the type map.
map $uri $stavewise_cache_control {
    default            $stavewise_cache_by_type;
    ~^/_astro/         "public, max-age=31536000, immutable";
}

# Port 80: everything to https://stavewise.app, except certbot's HTTP-01
# challenge (webroot /opt/stavewise/acme, next to the site root, #538 point 10).
server {
    listen 80;
    listen [::]:80;
    server_name stavewise.app www.stavewise.app;

    location /.well-known/acme-challenge/ {
        root /opt/stavewise/acme;
    }

    location / {
        return 301 https://stavewise.app$request_uri;
    }
}

# www on 443: one address, one delivery (#545 "VPS": www -> stavewise.app).
server {
    # `listen ... http2` instead of `http2 on;` so the file also loads on
    # nginx older than 1.25.1; newer versions only warn.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stavewise.app;

    ssl_certificate     /etc/letsencrypt/live/stavewise.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stavewise.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://stavewise.app$request_uri;
}

# The site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stavewise.app;

    # Certificate from certbot (#545 "VPS"), one certificate for both names.
    ssl_certificate     /etc/letsencrypt/live/stavewise.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stavewise.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:stavewise_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/stavewise-site.conf;
}
