# GoAccess configuration for the access statistics of stavewise.app (#600).
# Install: /etc/goaccess/stavewise.conf; run by stavewise-goaccess.service.
#
# #542 decision 9: "GoAccess mit `--anonymize-ip` und `--persist`, die
# anonymisierte Statistik bleibt". The raw logs go after 14 days
# (ops/logrotate/stavewise-web), the statistics stay in db-path.

# nginx writes the combined format (ops/nginx/stavewise-site.conf).
log-format COMBINED

# Privacy policy part B.2: IPv4 "um die letzte Stelle", IPv6 "um die letzten
# 80 Bit" gekürzt. The GoAccess manual (https://goaccess.io/man) says
# anonymize-ip "sets the last octet of IPv4 and last 80 bits of IPv6 to
# zeros", but GoAccess 1.12 does not do that at the default level 1. Measured
# with allinurl/goaccess 1.12 (#600):
#   level 1: 192.168.20.100 -> 192.168.20.0, 2a03:2880:2110:df07:... -> 2a03:2880:2110:df07::  (IPv6 only 64 bits)
#   level 2: 192.168.20.100 -> 192.168.0.0,  2a03:2880:2110:df07:... -> 2a03:2880:2110::       (IPv6 80 bits)
# Level 2 is the lowest level that keeps the IPv6 promise of part B.2; it cuts
# IPv4 by two octets, more than B.2 states. B.2 still needs adjusting (see the
# PR of #600). The address is cut while parsing, so the database never holds
# a full address.
anonymize-ip true
anonymize-level 2

# Keep the statistics across runs: restore loads the database, persist writes
# it back. GoAccess remembers inode, last line and timestamp per log file, so
# the hourly re-read of the same file does not count lines twice.
persist true
restore true
db-path /opt/stavewise/goaccess/db

# No live server, no WebSocket: one static report per run.
real-time-html false
